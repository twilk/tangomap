name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Regression gate. Chiefly `local/no-internal-a-href`: an internal <a href> is a
      # full page reload, which is how 50 of them accumulated before #49. Runs with
      # --max-warnings=0, so a warning fails the build too. Cheap, so it goes first.
      - run: npm run lint
      # Fails on a new HIGH/CRITICAL advisory in PRODUCTION dependencies. The tree is
      # at zero as of this commit, so any hit is genuinely new. --omit=dev on purpose:
      # a devDependency advisory never reaches users and must not block a release.
      - run: npm audit --omit=dev --audit-level=high
      # Type errors in test/ are invisible to `next build` (it does not typecheck
      # test files) and to vitest (it does not typecheck at all). #64 merged one.
      - run: npm run typecheck
      # Guards drift between design/tokens.ts and the generated CSS/JS/DESIGN.md.
      - run: npm run design:check
      - run: npm test
      # `build` re-runs design:check then `next build`; proves every route compiles.
      - run: npm run build
